services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    volumes:
      - .:/app
      - type: bind
        source: ${LOCAL_STORAGE:?Renseigner LOCAL_STORAGE dans .env}
        target: /app/data/01_raw
        read_only: true
    ports:
      - "127.0.0.1:8501:8501"
    init: true
    command:
      - /bin/sh
      - -c
      - >
        uv sync --locked &&
        exec streamlit run main.py
        --server.address=0.0.0.0
        --server.port=8501